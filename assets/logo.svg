<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="50%" stop-color="#693d18"/>
      <stop offset="100%" stop-color="#3b1d09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeccb"/>
      <stop offset="50%" stop-color="#e5b27a"/>
      <stop offset="100%" stop-color="#b57614"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  
  <!-- Outer Card Body with subtle drop shadow -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#leatherGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#cardShadow)"/>
  
  <!-- Subtle inner decorative border -->
  <rect x="48" y="48" width="416" height="416" rx="78" fill="none" stroke="rgba(212, 163, 115, 0.28)" stroke-width="3"/>
  
  <!-- The M Roman Serif Glyph -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" 
        font-family="'Cinzel', 'Cormorant Garamond', 'Georgia', serif" 
        font-weight="700" font-size="285" fill="url(#goldGrad)" 
        letter-spacing="-2" filter="url(#mShadow)">M</text>
</svg>
